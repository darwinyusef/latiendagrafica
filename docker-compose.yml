networks:
  caddy-net:
    external: true

services:

  # ── Backend Python / Flask ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    env_file: .env
    volumes:
      - ./backend:/app
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--timeout", "30", "--access-logfile", "-", "app:app"]
    restart: unless-stopped
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Nginx (archivos estáticos + proxy API) ─────────────────────────────────
  web:
    image: nginx:1.27-alpine
    container_name: latiendagrafica
    expose:
      - "80"
    networks:
      - default
      - caddy-net
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
